<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Aqualium ロゴ:知識をたたえた「水のしずく(水瓶)」と、それを回る「原子の軌道(-ium)」 -->
  <defs>
    <linearGradient id="aqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04143a"/>
      <stop offset=".55" stop-color="#1146d6"/>
      <stop offset="1" stop-color="#0fa3b8"/>
    </linearGradient>
    <linearGradient id="aqDrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6f3f8"/>
    </linearGradient>
    <linearGradient id="aqWater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#14b8c8"/>
    </linearGradient>
    <clipPath id="aqClip"><path d="M60 20 C60 20 34 52 34 72 A26 26 0 0 0 86 72 C86 52 60 20 60 20 Z"/></clipPath>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#aqBg)"/>
  <!-- しずく -->
  <path d="M60 20 C60 20 34 52 34 72 A26 26 0 0 0 86 72 C86 52 60 20 60 20 Z" fill="url(#aqDrop)"/>
  <!-- しずくの中の水(知識が満ちていく) -->
  <g clip-path="url(#aqClip)">
    <path d="M28 74 Q40 66 52 74 T76 74 T100 74 V110 H28 Z" fill="url(#aqWater)"/>
  </g>
  <!-- ひかり -->
  <path d="M48 56 Q46 64 47 70" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".9"/>
  <!-- 原子の軌道と電子 -->
  <ellipse cx="60" cy="72" rx="47" ry="15" transform="rotate(-24 60 72)" fill="none" stroke="#ffffff" stroke-width="3.2" opacity=".85"/>
  <circle cx="100" cy="53" r="6" fill="#ffffff"/>
  <circle cx="100" cy="53" r="2.6" fill="#14b8c8"/>
</svg>
